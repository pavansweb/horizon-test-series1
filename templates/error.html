<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notice - HORIZON TEST SERIES</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      background: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .box {
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 32px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body>
  <div class="box">
    <div style="font-size: 36px; margin-bottom: 12px;">⚠️</div>
    <h2 style="font-size: 18px; font-weight: 700; color: #1e293b; margin-bottom: 8px;">
      Notice
    </h2>
    <p style="font-size: 13px; color: #64748b; margin-bottom: 20px;">
      {{ message or 'The requested page or test is not available.' }}
    </p>
    <a href="/" class="cbt-btn cbt-btn-blue" style="padding: 8px 20px; font-size: 12px; text-decoration: none;">
      Back to Home
    </a>
  </div>
</body>
</html>
