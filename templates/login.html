<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - HORIZON TEST SERIES</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 32px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .form-group input:focus {
      outline: none;
      border-color: #1e4273;
    }
    .error-msg {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div style="text-align: center; margin-bottom: 24px;">
      <h1 style="font-size: 20px; font-weight: 800; color: #1e4273; margin: 0; text-transform: uppercase;">
        HORIZON TEST SERIES
      </h1>
      <div style="font-size: 11px; font-weight: 600; color: #64748b; margin-top: 4px;">
        ADMINISTRATION PORTAL
      </div>
    </div>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label for="password">Admin Password</label>
        <input type="password" id="password" name="password" required autofocus placeholder="Enter admin password">
      </div>
      <button type="submit" class="cbt-btn cbt-btn-blue" style="width: 100%; padding: 10px; font-size: 13px;">
        Sign In to Admin
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
      <a href="/" style="font-size: 12px; color: #64748b; text-decoration: none;">&larr; Back to Student Portal</a>
    </div>
  </div>

</body>
</html>
